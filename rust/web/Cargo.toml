[package]
name = "logbook-web"
version = "0.1.0"
edition = "2024"
description = "Logbook user interface (Leptos, compiled to WebAssembly)"

[dependencies]
base64 = "0.23.1"
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.8.0", default-features = false, features = ["http", "json"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
logbook-core = { path = "../core" }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "Storage", "File", "FileList", "Location", "Event", "EventTarget", "console"] }
