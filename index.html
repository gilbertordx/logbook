<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGBOOK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hdr">
    <div class="hdr-left">
      <span class="tbjp-tag">tbjp</span>
      <span class="hdr-title">LOGBOOK</span>
    </div>
    <div class="hdr-right">
      <span>FORM: IMMACULATE</span>
      <span>TARGET: 3-7 REPS @ 1 RIR</span>
      <span id="session-timer-display" class="session-timer">[TIME: 00:00]</span>
      <button class="btn-subtle" id="btn-spotify-toggle" title="Spotify Music Control">[SPOTIFY]</button>
      <button class="btn-subtle" id="btn-github-sync" title="GitHub Auto-Sync Status">[SYNC: LOCAL]</button>
      <button class="btn-subtle" id="btn-export" title="Export Backup">[EXP]</button>
      <button class="btn-subtle" id="btn-import" title="Import Backup">[IMP]</button>
      <input type="file" id="import-file" style="display:none;" accept=".json">
    </div>
  </header>

  <main class="grid-main">
    <!-- CALENDAR & CONTROLS PANEL -->
    <section class="panel cal-panel">
      <div class="cal-nav">
        <button id="cal-prev" class="btn">&lt;</button>
        <span id="cal-title" class="cal-title">07/26</span>
        <button id="cal-next" class="btn">&gt;</button>
        <button id="today-btn" class="btn">[TODAY]</button>
      </div>
      <div class="cal-head">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
      <div id="calendar-grid" class="cal-days"></div>

      <!-- SPOTIFY MUSIC CONTROL CARD (RAW MONOCHROME - NO BUZZWORDS) -->
      <div class="math-card spotify-card" id="spotify-card">
        <div class="math-header-expand">
          <span>// SPOTIFY</span>
          <button class="btn-subtle" id="btn-spotify-login">[CONNECT]</button>
        </div>
        <div class="spotify-track-info" id="spotify-track-name">
          [NO ACTIVE PLAYBACK]
        </div>
        <div class="spotify-controls">
          <button class="btn-subtle" id="sp-prev">[&lt;&lt; PREV]</button>
          <button class="btn-subtle" id="sp-play">[PLAY/PAUSE]</button>
          <button class="btn-subtle" id="sp-next">[NEXT &gt;&gt;]</button>
        </div>
        <div style="display:flex; gap:4px; margin-top:4px;">
          <button class="btn-subtle" id="sp-vibe-warmup" style="flex:1;">[WARMUP]</button>
          <button class="btn-subtle" id="sp-vibe-heavy" style="flex:1; font-weight:800; color:var(--white);">[WORKSET]</button>
        </div>
        <!-- Embed Player Quick Backup -->
        <div id="spotify-embed-container" style="margin-top:8px;">
          <iframe id="spotify-iframe" style="border-radius:0px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX76Wlfdnj7AP?utm_source=generator&theme=0" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
      </div>

      <!-- COLLAPSIBLE WORK SETS BREAKDOWN CARD -->
      <div class="math-card">
        <div class="math-header-expand" id="math-header-expand" onclick="toggleWorkSetsExpand()">
          <span id="stat-total-worksets">// TOTAL WORK SETS: 0</span>
          <button class="btn-subtle" id="btn-expand-worksets">[+]</button>
        </div>
        <div id="muscle-group-list" class="muscle-group-list" style="display:none;">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </section>

    <!-- LOG PANEL -->
    <section class="panel log-panel">
      <div class="log-top">
        <span id="log-date" class="date-str">26/07/26</span>
        <div class="preset-btns">
          <button class="btn" id="btn-load-routine">[LOAD ROUTINE]</button>
          <button class="btn" id="btn-clear">[CLEAR]</button>
          <button class="btn btn-undo" id="btn-undo" style="display:none;">[UNDO CLEAR]</button>
        </div>
      </div>

      <div id="exercise-container" class="ex-container">
        <!-- Rendered dynamically -->
      </div>

      <div class="log-actions" id="log-actions" style="display:none;">
        <button id="btn-add-ex" class="btn">+ EXERCISE</button>
        <button id="btn-save" class="btn btn-save">[SAVE DAY & SYNC]</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
