<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGBOOK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hdr">
    <div class="hdr-left">
      <span class="tbjp-tag">tbjp</span>
      <span class="hdr-title">LOGBOOK</span>
    </div>
    <div class="hdr-right">
      <span>FORM: IMMACULATE</span>
      <span>TARGET: 3-7 REPS @ 1 RIR</span>
      <span id="session-timer-display" class="session-timer">[TIME: 00:00]</span>
      <button class="btn-subtle" id="btn-garmin-toggle" title="Manual Garmin metrics and file import">[GARMIN DATA]</button>
      <a class="btn-subtle" href="https://open.spotify.com" target="_blank" rel="noopener" title="Open Spotify">[SPOTIFY]</a>
      <button class="btn-subtle" id="btn-github-sync" title="GitHub Auto-Sync Status">[SYNC: LOCAL]</button>
      <button class="btn-subtle" id="btn-export" title="Export Backup">[EXP]</button>
      <button class="btn-subtle" id="btn-import" title="Import Backup">[IMP]</button>
      <input type="file" id="import-file" style="display:none;" accept=".json">
    </div>
  </header>

  <main class="grid-main">
    <!-- CALENDAR & CONTROLS PANEL -->
    <section class="panel cal-panel">
      <div class="cal-nav">
        <button id="cal-prev" class="btn">&lt;</button>
        <span id="cal-title" class="cal-title">07/26</span>
        <button id="cal-next" class="btn">&gt;</button>
        <button id="today-btn" class="btn">[TODAY]</button>
      </div>
      <div class="cal-head">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
      <div id="calendar-grid" class="cal-days"></div>

      <!-- MANUAL GARMIN METRICS AND EXPORT IMPORT -->
      <div class="math-card garmin-card" id="garmin-card" style="display:none;">
        <div class="math-header-expand">
          <span>// GARMIN WORKOUT METRICS</span>
        </div>

        <div class="garmin-status-bar" id="garmin-status-bar">
          STATUS: MANUAL ENTRY OR JSON/TCX IMPORT
        </div>
        
        <div class="garmin-drop-zone" id="garmin-drop-zone">
          <div class="garmin-metrics-grid">
            <div class="garmin-metric-box">
              <span class="garmin-label">AVG HR</span>
              <input type="number" id="garmin-avg-hr" class="garmin-input" placeholder="135" onchange="saveGarminMetrics()">
              <span class="garmin-unit">BPM</span>
            </div>
            <div class="garmin-metric-box">
              <span class="garmin-label">PEAK HR</span>
              <input type="number" id="garmin-max-hr" class="garmin-input" placeholder="165" onchange="saveGarminMetrics()">
              <span class="garmin-unit">BPM</span>
            </div>
            <div class="garmin-metric-box">
              <span class="garmin-label">ACTIVE ENERGY</span>
              <input type="number" id="garmin-kcals" class="garmin-input" placeholder="420" onchange="saveGarminMetrics()">
              <span class="garmin-unit">KCAL</span>
            </div>
          </div>
          <button class="btn-subtle" id="btn-garmin-import" style="width:100%; margin-top:4px;">[IMPORT JSON/TCX]</button>
          <input type="file" id="garmin-file-input" style="display:none;" accept=".tcx,.json,application/json,application/xml,text/xml">
        </div>
      </div>

      <!-- SPOTIFY MUSIC CONTROL CARD (RAW MONOCHROME - NO BUZZWORDS) -->
      <div class="math-card spotify-card" id="spotify-card">
        <a class="spotify-link" href="https://open.spotify.com" target="_blank" rel="noopener">// SPOTIFY: OPEN APP &#8599;</a>
      </div>

      <!-- COLLAPSIBLE WORK SETS BREAKDOWN CARD -->
      <div class="math-card">
        <div class="math-header-expand" id="math-header-expand" onclick="toggleWorkSetsExpand()">
          <span id="stat-total-worksets">// TOTAL SETS: 0</span>
          <button class="btn-subtle" id="btn-expand-worksets">[+]</button>
        </div>
        <div id="muscle-group-list" class="muscle-group-list" style="display:none;">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </section>

    <!-- LOG PANEL -->
    <section class="panel log-panel">
      <div class="log-top">
        <span id="log-date" class="date-str">26/07/26</span>
        <div class="preset-btns">
          <button class="btn" id="btn-load-routine">[LOAD ROUTINE]</button>
          <button class="btn" id="btn-clear">[CLEAR]</button>
          <button class="btn btn-undo" id="btn-undo" style="display:none;">[UNDO CLEAR]</button>
        </div>
      </div>

      <div id="exercise-container" class="ex-container">
        <!-- Rendered dynamically -->
      </div>

      <div class="log-actions" id="log-actions" style="display:none;">
        <button id="btn-add-ex" class="btn">+ EXERCISE</button>
        <button id="btn-save" class="btn btn-save">[SAVE DAY & SYNC]</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
